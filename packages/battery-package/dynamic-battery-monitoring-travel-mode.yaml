# =========================================================
# Dynamic Battery Monitoring Package for Home Assistant
# =========================================================
# Purpose:
# - Dynamically discover battery percentage sensors in Home Assistant
# - Use Home Assistant's device_class = battery
# - Include all battery devices exposed to HA
# - Support three levels:
#   1. Warning
#   2. Critical
#   3. Travel readiness
#
# Notes:
# - This package is fully dynamic
# - No manual entity list is required
# - New battery devices should be picked up automatically
# - This package only looks at sensor entities with device_class: battery
# - It is intended for battery percentage values, not voltage sensors
# =========================================================


input_number:
  # =======================================================
  # EDIT HERE IF NEEDED
  # General low battery warning threshold
  # Devices at or below this value appear in the warning list
  # =======================================================
  battery_warning_threshold:
    name: Battery Warning Threshold
    min: 1
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-20
    initial: 20

  # =======================================================
  # EDIT HERE IF NEEDED
  # General critical battery threshold
  # Devices at or below this value appear in the critical list
  # =======================================================
  battery_critical_threshold:
    name: Battery Critical Threshold
    min: 1
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-alert
    initial: 10

  # =======================================================
  # EDIT HERE IF NEEDED
  # Travel readiness threshold
  #
  # Suggested rule of thumb:
  # - Short trip: 35 to 40
  # - 1 to 2 weeks: 50
  # - Around a month: 60
  #
  # Devices at or below this value appear in the travel list
  # =======================================================
  battery_travel_threshold:
    name: Battery Travel Threshold
    min: 1
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:airplane
    initial: 40


template:
  - sensor:

      # =====================================================
      # BATTERY WARNING COUNT
      # Counts battery percentage sensors at or below the
      # warning threshold
      # =====================================================
      - name: Battery Warning Count
        unique_id: battery_warning_count
        icon: mdi:battery-20
        state: >
          {% set threshold = states('input_number.battery_warning_threshold') | int(20) %}
          {% set ns = namespace(count=0) %}

          {% for s in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
            {% set level = s.state | int(-1) %}
            {% if 0 <= level <= threshold %}
              {% set ns.count = ns.count + 1 %}
            {% endif %}
          {% endfor %}

          {{ ns.count }}

      # =====================================================
      # BATTERY CRITICAL COUNT
      # Counts battery percentage sensors at or below the
      # critical threshold
      # =====================================================
      - name: Battery Critical Count
        unique_id: battery_critical_count
        icon: mdi:battery-alert
        state: >
          {% set threshold = states('input_number.battery_critical_threshold') | int(10) %}
          {% set ns = namespace(count=0) %}

          {% for s in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
            {% set level = s.state | int(-1) %}
            {% if 0 <= level <= threshold %}
              {% set ns.count = ns.count + 1 %}
            {% endif %}
          {% endfor %}

          {{ ns.count }}

      # =====================================================
      # BATTERY TRAVEL COUNT
      # Counts battery percentage sensors at or below the
      # travel readiness threshold
      # =====================================================
      - name: Battery Travel Count
        unique_id: battery_travel_count
        icon: mdi:airplane
        state: >
          {% set threshold = states('input_number.battery_travel_threshold') | int(40) %}
          {% set ns = namespace(count=0) %}

          {% for s in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
            {% set level = s.state | int(-1) %}
            {% if 0 <= level <= threshold %}
              {% set ns.count = ns.count + 1 %}
            {% endif %}
          {% endfor %}

          {{ ns.count }}

      # =====================================================
      # BATTERY WARNING LIST
      # Human-readable list of battery devices at or below
      # the warning threshold
      # =====================================================
      - name: Battery Warning List
        unique_id: battery_warning_list
        icon: mdi:battery-20
        state: >
          {% set threshold = states('input_number.battery_warning_threshold') | int(20) %}
          {% set ns = namespace(items=[]) %}

          {% for s in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
            {% set level = s.state | int(-1) %}
            {% if 0 <= level <= threshold %}
              {% set ns.items = ns.items + [s.name ~ ' (' ~ level ~ '%)'] %}
            {% endif %}
          {% endfor %}

          {{ ns.items | join(', ') if ns.items | count > 0 else 'All batteries are OK' }}

      # =====================================================
      # BATTERY CRITICAL LIST
      # Human-readable list of battery devices at or below
      # the critical threshold
      # =====================================================
      - name: Battery Critical List
        unique_id: battery_critical_list
        icon: mdi:battery-alert
        state: >
          {% set threshold = states('input_number.battery_critical_threshold') | int(10) %}
          {% set ns = namespace(items=[]) %}

          {% for s in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
            {% set level = s.state | int(-1) %}
            {% if 0 <= level <= threshold %}
              {% set ns.items = ns.items + [s.name ~ ' (' ~ level ~ '%)'] %}
            {% endif %}
          {% endfor %}

          {{ ns.items | join(', ') if ns.items | count > 0 else 'No critical batteries' }}

      # =====================================================
      # BATTERY TRAVEL LIST
      # Human-readable list of devices that should be checked
      # before travel based on the travel threshold
      # =====================================================
      - name: Battery Travel List
        unique_id: battery_travel_list
        icon: mdi:airplane
        state: >
          {% set threshold = states('input_number.battery_travel_threshold') | int(40) %}
          {% set ns = namespace(items=[]) %}

          {% for s in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
            {% set level = s.state | int(-1) %}
            {% if 0 <= level <= threshold %}
              {% set ns.items = ns.items + [s.name ~ ' (' ~ level ~ '%)'] %}
            {% endif %}
          {% endfor %}

          {{ ns.items | join(', ') if ns.items | count > 0 else 'All travel batteries are OK' }}


  - binary_sensor:

      # =====================================================
      # BATTERY WARNING ACTIVE
      # On if one or more battery devices are at or below the
      # warning threshold
      # =====================================================
      - name: Battery Warning Active
        unique_id: battery_warning_active
        icon: mdi:battery-20
        state: >
          {{ states('sensor.battery_warning_count') | int(0) > 0 }}

      # =====================================================
      # BATTERY CRITICAL ACTIVE
      # On if one or more battery devices are at or below the
      # critical threshold
      # =====================================================
      - name: Battery Critical Active
        unique_id: battery_critical_active
        icon: mdi:battery-alert
        state: >
          {{ states('sensor.battery_critical_count') | int(0) > 0 }}

      # =====================================================
      # BATTERY TRAVEL ACTIVE
      # On if one or more battery devices are at or below the
      # travel readiness threshold
      # =====================================================
      - name: Battery Travel Active
        unique_id: battery_travel_active
        icon: mdi:airplane
        state: >
          {{ states('sensor.battery_travel_count') | int(0) > 0 }}
